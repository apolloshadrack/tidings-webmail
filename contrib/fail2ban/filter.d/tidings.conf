# Fail2ban filter for Tidings login failures.
# Tidings logs one JSON line per failed sign-in:
#   {"level":40,...,"event":"login_failed","ip":"203.0.113.7","user":"alice@example.com","msg":"tidings login failed"}
[Definition]
failregex = ^.*"event":"login_failed","ip":"<HOST>".*$
ignoreregex =
datepattern = "time":{EPOCH}
