name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (security-critical helpers)
        run: npm test
      - name: Theme contrast (WCAG AA for every theme)
        run: npx tsx scripts/check-contrast.ts
      - name: Sandbox guard (no script-enabled iframes, one innerHTML sink)
        run: node scripts/check-sandbox.mjs
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tidings:ci
